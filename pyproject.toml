[project]
name = "cp5-calcadas"
version = "0.1.0"
description = "CPZÃO - Auditoria de Calçadas (YOLO)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics",
    "ipykernel",
    "pandas",
    "matplotlib",
    "nbconvert>=7.17.1",
    "onnx>=1.23.2",
    "onnxslim>=0.1.98",
    "onnxruntime>=1.31.0",
]

# PyTorch com CUDA 12.8 (Windows/Linux). Em macOS cai no PyPI (CPU/MPS).
# Troque pela sua versão instalada do CUDA.
[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
